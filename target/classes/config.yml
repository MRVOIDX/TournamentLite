# ================================================================
#  TournamentsLite - config.yml
# ================================================================
# This file only controls the GUI shape/size and global timing.
#
# Each tournament lives in its OWN file under the "tournaments/"
# folder next to this file (uhc.yml, cartpvp.yml, clanwars.yml by
# default). Open one of those to change its slot/item/schedule, or
# to type in that week's top 5 by hand. All GUI TEXT/LORE lives in
# messages.yml, not here.
# ================================================================

gui:
  # Rows * 9 = inventory size. 1-6 rows.
  rows: 3
  # Slots not used by a tournament are filled with this filler pane.
  # Set "fill-empty: false" to leave them empty instead.
  fill-empty: true
  filler-material: GRAY_STAINED_GLASS_PANE

# How often (in seconds) the plugin re-reads each tournament file's
# "leaderboard" section from disk, so names you type in by hand show up
# in the GUI without needing /tl reload. This is real disk I/O, so it
# always runs off the main/region threads (AsyncScheduler) - it cannot
# cause a TPS spike no matter how low you set it. 15-30s is plenty.
leaderboard-refresh-interval-seconds: 30

# How long (in ticks - 20 ticks = 1 second) the private pre-teleport
# animation plays for each signed-up player before /tl tpsigned actually
# teleports them. 20-40 (1-2s) is recommended. The animation (a totem-pop
# style screen flash + themed particle + sound) is only ever visible to
# the player being teleported, never to bystanders - see TeleportAnimator
# in the source for exactly how that privacy is achieved.
teleport-animation-delay-ticks: 30
