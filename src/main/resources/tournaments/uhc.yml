# ================================================================
#  This tournament's own file - edit it directly, no command needed.
#  The plugin re-reads the "leaderboard" section from disk automatically
#  every few seconds, so changes show up in the GUI on their own.
# ================================================================

display-name: "UHC"
slot: 10
material: GOLDEN_APPLE

# Which day this tournament recurs on (purely for the GUI's "Every X" /
# countdown display). One of: MONDAY, TUESDAY, WEDNESDAY, THURSDAY,
# FRIDAY, SATURDAY, SUNDAY. Leave blank ("") for no fixed schedule.
weekday: WEDNESDAY

# Item icon shown privately to signed-up players during the pre-teleport
# animation when you run /tl tpsigned uhc. Leave blank to reuse "material"
# above instead.
animation-item: COBWEB

# Item icon shown inside this tournament's sign-up/leave confirmation
# Dialog popup (only appears while "gui.confirmation-dialog.enabled" is
# true in config.yml). Leave blank to use whatever
# "gui.confirmation-dialog.icon-material" is set to in config.yml instead
# (which itself defaults to "material" above). This is a good place to
# swap the popup's icon to something more thematic - e.g. a totem for a
# risky UHC-style event, or, as set here, a cobweb.
dialog-icon: COBWEB

# Type the winners in by hand after each event. Any of these can be a
# player name, a team name, or anything else you want displayed - it's
# just text, not tied to an actual online player.
leaderboard:
  1: ""
  2: ""
  3: ""
  4: ""
  5: ""
