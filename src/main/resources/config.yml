# ================================================================
#  TournamentsLite - config.yml
# ================================================================
# This file only controls the GUI shape/size and global timing.
#
# Each tournament lives in its OWN file under the "tournaments/"
# folder next to this file (uhc.yml, cartpvp.yml, clanwars.yml by
# default). Open one of those to change its slot/item/schedule, or
# to type in that week's top 5 by hand. All GUI TEXT/LORE lives in
# messages.yml, not here.
# ================================================================

gui:
  # Rows * 9 = inventory size. 1-6 rows.
  rows: 3
  # Slots not used by a tournament are filled with this filler pane.
  # Set "fill-empty: false" to leave them empty instead.
  fill-empty: true
  filler-material: GRAY_STAINED_GLASS_PANE

  # ----------------------------------------------------------------
  # Confirmation dialog
  # ----------------------------------------------------------------
  # Clicking a tournament in the menu can either instantly sign you up /
  # remove you (the old behavior), or first pop up Minecraft's own native
  # "Dialog" screen (the in-game menu system added in 1.21.6) asking you
  # to confirm. ALL of that popup's text - title, description, button
  # labels, button tooltips, and any emoji in them - lives in messages.yml
  # under "dialog.signup" and "dialog.leave", not here. This section only
  # controls whether it's used at all, and which item icon it shows.
  confirmation-dialog:
    # Master on/off switch. false = clicking a tournament instantly signs
    # you up / removes you again, exactly like before this feature existed.
    # true = a confirmation popup appears first and nothing changes until
    # you press its confirm button.
    enabled: true

    # Whether pressing Escape closes the popup without confirming (same
    # as pressing its cancel button). If false, players must explicitly
    # click one of the two buttons.
    can-close-with-escape: true

    # The item shown inside the popup, next to its text. Accepts:
    #   - "TOURNAMENT_ICON" (default): reuse whatever "material:" that
    #     tournament already uses in the main menu.
    #   - "NONE": don't show any icon, text only.
    #   - any other Material name (e.g. COBWEB, NETHER_STAR, PLAYER_HEAD,
    #     DIAMOND_SWORD, TOTEM_OF_UNDYING...) to use that item for EVERY
    #     tournament's popup.
    # A single tournament can override this on its own with "dialog-icon:"
    # in its own file under tournaments/ (see uhc.yml for an example) -
    # that always takes priority over whatever is set here.
    icon-material: "TOURNAMENT_ICON"

    # Whether the popup's item shows its normal glint/enchant decorations.
    show-item-decorations: true
    # Whether hovering the popup's item shows its normal tooltip (name/lore).
    show-item-tooltip: true

# How often (in seconds) the plugin re-reads each tournament file's
# "leaderboard" section from disk, so names you type in by hand show up
# in the GUI without needing /tl reload. This is real disk I/O, so it
# always runs off the main/region threads (AsyncScheduler) - it cannot
# cause a TPS spike no matter how low you set it. 15-30s is plenty.
leaderboard-refresh-interval-seconds: 30

# How long (in ticks - 20 ticks = 1 second) the private pre-teleport
# animation plays for each signed-up player before /tl tpsigned actually
# teleports them. 20-40 (1-2s) is recommended. The animation (a totem-pop
# style screen flash + themed particle + sound) is only ever visible to
# the player being teleported, never to bystanders - see TeleportAnimator
# in the source for exactly how that privacy is achieved.
teleport-animation-delay-ticks: 30
